<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lock screen — fingerprint</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0D1014}
a{color:#5EEAD4}a:hover{color:#99F6E4}
@keyframes fpPulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.7);opacity:0}}
.fp-ring{animation:fpPulse 1.8s ease-out infinite}
@media (prefers-reduced-motion: reduce){.fp-ring{animation:none;opacity:.25}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 96px 24px 40px; display: flex; flex-direction: column; align-items: center; background: #0D1014; color: #EEF1F5; font-family: Inter, system-ui, sans-serif">
  <div style="position: relative; width: 84px; height: 84px">
    <span style="width: 84px; height: 84px; border-radius: 26px; background: #2F7D55; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 36px; font-weight: 700">W</span>
    <span style="position: absolute; right: -8px; bottom: -8px; width: 34px; height: 34px; border-radius: 17px; background: #0D1014; display: flex; align-items: center; justify-content: center">
      <span style="width: 28px; height: 28px; border-radius: 14px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0D1014" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </span>
    </span>
  </div>
  <h1 style="margin: 28px 0 8px; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.3px; text-align: center">WhatsApp is locked</h1>
  <p style="margin: 0; font-size: 15px; color: #9AA3AF; text-align: center">Unlock to continue</p>

  <div style="flex-grow: 1"></div>

  <a href="Home.dc.html" aria-label="Touch to unlock with fingerprint" style="position: relative; width: 96px; height: 96px; display: flex; align-items: center; justify-content: center; border-radius: 48px; text-decoration: none">
    <span class="fp-ring" aria-hidden="true" style="position: absolute; inset: 0; border-radius: 48px; border: 2px solid {{accent}}"></span>
    <span style="width: 96px; height: 96px; border-radius: 48px; background: #161A20; border: 1px solid #2A303A; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"></path><path d="M14 13.12c0 2.38 0 6.38-1 8.88"></path><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"></path><path d="M2 12a10 10 0 0 1 18-6"></path><path d="M2 16h.01"></path><path d="M21.8 16c.2-2 .131-5.354 0-6"></path><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"></path><path d="M8.65 22c.21-.66.45-1.32.57-2"></path><path d="M9 6.8a6 6 0 0 1 9 5.2v2"></path></svg>
    </span>
  </a>
  <p style="margin: 20px 0 0; font-size: 15px; font-weight: 500; text-align: center">Touch the sensor to unlock</p>
  <p style="margin: 6px 0 0; font-size: 13px; color: #9AA3AF; text-align: center">The sensor is under the screen, here</p>

  <div style="height: 64px"></div>

  <a href="LockPin.dc.html" style="width: 100%; height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 26px; border: 1px solid #3A414D; box-sizing: border-box; color: #EEF1F5; font-size: 15px; font-weight: 600; text-decoration: none">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"></path><path d="m21 2-9.6 9.6"></path><circle cx="7.5" cy="15.5" r="5.5"></circle></svg>
    Use PIN instead
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5EEAD4","options":["#5EEAD4","#8AB4FF","#FBBF24","#C4B5FD"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5EEAD4' };
  }
}
</script>
</body>
</html>
