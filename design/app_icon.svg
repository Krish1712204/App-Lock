<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
  <!-- App Lock logo: a padlock whose body carries a fingerprint.
       Source for the Android icon (android/app/src/main/res/drawable/ic_launcher_*.xml).
       Colors: background #0B0E12 → #1A2530 glow, accent #5EEAD4. -->
  <defs>
    <radialGradient id="bg" cx="54" cy="38" r="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A2530"/>
      <stop offset="1" stop-color="#0B0E12"/>
    </radialGradient>
    <linearGradient id="body" x1="54" y1="46" x2="54" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7CF3E0"/>
      <stop offset="1" stop-color="#2CC9B2"/>
    </linearGradient>
    <clipPath id="shape"><rect width="108" height="108" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#shape)">
    <rect width="108" height="108" fill="url(#bg)"/>
    <g transform="translate(0 1.5) translate(54 54) scale(1.08) translate(-54 -54)">
      <path d="M42 47 V40 a12 12 0 0 1 24 0 V47" fill="none" stroke="#5EEAD4" stroke-width="6.5" stroke-linecap="round"/>
      <rect x="33" y="46" width="42" height="34" rx="9" fill="url(#body)"/>
      <g fill="none" stroke="#0D1014" stroke-width="2.9" stroke-linecap="round">
        <path d="M42.6 68 V66 A11.4 11.4 0 0 1 65.4 66 V70"/>
        <path d="M46.6 71.5 V66 A7.4 7.4 0 0 1 61.4 66 V73.5"/>
        <path d="M50.6 70.5 V66 A3.4 3.4 0 0 1 57.4 66 V68.5"/>
        <path d="M54 65.5 V75"/>
      </g>
    </g>
  </g>
</svg>
